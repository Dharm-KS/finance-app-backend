# API + MySQL. Start with:  docker compose up -d --build
# Settings come from .env (see .env.example, "Docker" section).

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: finance_app
      MYSQL_USER: finance_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql  # data survives container restarts and rebuilds
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    # No ports: MySQL is reachable only by the api container.

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql+aiomysql://finance_user:${DB_PASSWORD}@db:3306/finance_app?charset=utf8mb4
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-80}:8000"

volumes:
  mysql_data:
