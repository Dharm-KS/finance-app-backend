<title>Finance Friend API</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; the flow is a vertical pipeline of phases, each a tinted panel; API cards below. */
:root {
  --bg: #f6f7f5; --surface: #ffffff; --surface-2: #eef1ee; --fg: #17201c; --muted: #5c6b64; --line: #d9e0dc;
  --accent: #0d6b55; --accent-soft: #dcefe8; --code-bg: #10201a; --code-fg: #d8eee5;
  --get: #1f6fb2; --post: #0d7a4f; --put: #9a5b00; --patch: #7a3fa0; --del: #b3261e;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1412; --surface: #151d1a; --surface-2: #1b2622; --fg: #e4ece8; --muted: #93a69d; --line: #2a3832;
  --accent: #4fc7a3; --accent-soft: #16352c; --code-bg: #0a110e; --code-fg: #cfe8dd;
  --get: #6fb2ec; --post: #52c78f; --put: #e0a443; --patch: #c08ae0; --del: #ef7a70; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #151d1a; --surface-2: #1b2622; --fg: #e4ece8; --muted: #93a69d; --line: #2a3832;
  --accent: #4fc7a3; --accent-soft: #16352c; --code-bg: #0a110e; --code-fg: #cfe8dd;
  --get: #6fb2ec; --post: #52c78f; --put: #e0a443; --patch: #c08ae0; --del: #ef7a70; color-scheme: dark; }

[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 880px; margin: 0 auto; padding-block: 32px 64px; }
code { font-family: var(--font-mono); font-size: .86em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
h1, h2 { text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: clamp(28px, 5vw, 38px); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h2 small { font-size: 13px; font-weight: 600; color: var(--muted); }
p { margin: 0; }
.muted { color: var(--muted); }

/* gate */
.gate { min-height: 70vh; display: grid; place-items: center; }
.gate-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; display: grid; gap: 14px; }
.gate-card h1 { font-size: 24px; }
.gate-card label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.gate-card input { font: inherit; padding: 11px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); }
.gate-card input:focus-visible, .btn:focus-visible, .toc a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { font: inherit; font-weight: 700; border: 0; border-radius: 9px; padding: 11px 14px; background: var(--accent); color: var(--surface); cursor: pointer; }
.btn:disabled { opacity: .6; cursor: wait; }
.gate-msg { min-height: 1.4em; font-size: 13px; color: var(--del); }

/* header */
.doc-head { display: grid; gap: 12px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.lead { font-size: 17px; color: var(--muted); max-width: 62ch; }
.toc { display: flex; flex-wrap: wrap; gap: 6px; }
.toc a { font-size: 13px; font-weight: 600; color: var(--fg); text-decoration: none; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.toc a:hover { border-color: var(--accent); color: var(--accent); }
.sec { display: grid; gap: 14px; padding-block: 34px 6px; scroll-margin-top: 16px; }
.sec > p { max-width: 70ch; }
.n { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--surface); font-size: 14px; }

/* method badges */
.m { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 2px 7px; border-radius: 5px; color: var(--surface); background: var(--muted); flex: none; }
.m.get { background: var(--get); } .m.post { background: var(--post); } .m.put { background: var(--put); } .m.patch { background: var(--patch); } .m.delete { background: var(--del); }

/* flow */
.flow { display: grid; justify-items: stretch; }
.phase { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 0; justify-items: center; }
.phase.quiet { background: transparent; border-style: dashed; }
.phase-label { justify-self: start; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
.phase-label span { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); }
.node { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; max-width: 100%; }
.node code, .branch code, .screen code { background: none; padding: 0; }
.node > code { font-weight: 500; }
.node small, .branch small, .screen small { flex-basis: 100%; font-size: 12.5px; color: var(--muted); }
.node.key { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.node-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: stretch; gap: 10px; width: 100%; margin-block: 4px; }
.branch { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; border: 1.5px dashed var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--muted); min-width: 0; max-width: 100%; }
.branch .if { flex-basis: 100%; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--put); }
.arrow { width: 2px; height: 22px; background: var(--line); position: relative; justify-self: center; margin-bottom: 6px; }
.arrow::after { content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); border: 6px solid transparent; border-top-color: var(--line); border-bottom: 0; }
.arrow.long { height: 30px; margin-block: 2px 8px; }
.screens { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; width: 100%; counter-reset: s; }
.screen { display: flex; gap: 10px; align-items: flex-start; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.screen i { font-style: normal; font-weight: 800; font-size: 13px; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--accent); flex: none; }
.screen > div { display: grid; gap: 2px; min-width: 0; }
.screen code { font-size: 12.5px; color: var(--muted); }
.trigger { margin-top: 12px; width: 100%; text-align: center; font-weight: 700; font-size: 14px; color: var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; }
.fan { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; width: 100%; }
.node.small { align-content: flex-start; }

/* api cards */
.api { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.api-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-weight: 600; }
.api-head code { background: none; padding: 0; font-size: 14px; }
.tag { margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
.code { position: relative; margin: 0; background: var(--code-bg); color: var(--code-fg); border-radius: 10px; padding: 14px 16px; overflow-x: auto; font: 12.5px/1.65 var(--font-mono); }
.code code { background: none; padding: 0; font-size: inherit; color: inherit; overflow-wrap: normal; white-space: pre; }
.copy { position: absolute; top: 8px; right: 8px; font: 600 11px var(--font-body); border: 1px solid #ffffff33; background: #ffffff14; color: var(--code-fg); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
.copy:hover { background: #ffffff26; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface-2); }
.lock-row { display: flex; justify-content: flex-end; padding-top: 12px; }
.linkbtn { font: inherit; font-size: 13px; font-weight: 600; background: none; border: 0; color: var(--muted); cursor: pointer; text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

<div class="wrap">
  <div id="gate" class="gate">
    <form id="gate-form" class="gate-card" autocomplete="off">
      <p class="eyebrow">Finance Friend · internal</p>
      <h1>API documentation</h1>
      <p class="muted">Enter the team password to open the docs.</p>
      <label for="pw">Password<input id="pw" type="password" autocomplete="current-password" required></label>
      <button id="unlock" class="btn" type="submit">Open docs</button>
      <p id="gate-msg" class="gate-msg" role="alert"></p>
    </form>
  </div>
  <div id="doc" hidden></div>
</div>

<script>
const PAYLOAD = __PAYLOAD__;
(() => {
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function decrypt(password) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
    return new TextDecoder().decode(plain);
  }
  function open(html) {
    const doc = document.getElementById("doc");
    doc.innerHTML = html + '<div class="lock-row"><button class="linkbtn" id="lock" type="button">Lock</button></div>';
    doc.querySelectorAll("pre.code").forEach((pre) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "copy"; b.textContent = "Copy"; pre.appendChild(b);
    });
    document.getElementById("gate").hidden = true; doc.hidden = false;
  }
  document.addEventListener("click", async (e) => {
    const b = e.target.closest(".copy");
    if (b) {
      const text = b.parentElement.querySelector("code").innerText;
      try { await navigator.clipboard.writeText(text); b.textContent = "Copied"; }
      catch { const r = document.createRange(); r.selectNodeContents(b.parentElement.querySelector("code")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected"; }
      setTimeout(() => (b.textContent = "Copy"), 1500);
      return;
    }
    if (e.target.id === "lock") {
      try { sessionStorage.removeItem("fa_docs_pw"); } catch {}
      document.getElementById("doc").innerHTML = ""; document.getElementById("doc").hidden = true;
      document.getElementById("gate").hidden = false; document.getElementById("pw").value = "";
    }
  });
  document.getElementById("gate-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = document.getElementById("pw").value, btn = document.getElementById("unlock"), msg = document.getElementById("gate-msg");
    btn.disabled = true; msg.textContent = "";
    try { open(await decrypt(pw)); try { sessionStorage.setItem("fa_docs_pw", pw); } catch {} }
    catch { msg.textContent = "Wrong password. Check it and try again."; }
    finally { btn.disabled = false; }
  });
  let saved = null; try { saved = sessionStorage.getItem("fa_docs_pw"); } catch {}
  if (saved) decrypt(saved).then(open).catch(() => {});
})();
</script>
